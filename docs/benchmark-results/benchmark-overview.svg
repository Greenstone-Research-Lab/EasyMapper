<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">EasyMapper performance overview</title>
  <desc id="description">BenchmarkDotNet latency comparison of manual mapping, EasyMapper, and AutoMapper. Lower values are better.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <style>.title{font:700 28px Segoe UI,Arial,sans-serif;fill:#f8fafc}.kicker{font:600 12px Segoe UI,Arial,sans-serif;fill:#34d399;letter-spacing:1.8px}.panel-title{font:700 18px Segoe UI,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 12px Segoe UI,Arial,sans-serif;fill:#94a3b8}.label{font:600 13px Segoe UI,Arial,sans-serif;fill:#cbd5e1}.value{font:700 13px Consolas,monospace;fill:#f8fafc}.footer{font:400 11px Segoe UI,Arial,sans-serif;fill:#94a3b8}</style>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#background)"/>
  <text x="28" y="38" class="kicker">BENCHMARKDOTNET | LOWER IS BETTER</text>
  <text x="28" y="72" class="title">EasyMapper performance overview</text>
  <rect x='28' y='92' width='360' height='326' rx='20' fill='#0f172a' stroke='#334155'/>
  <text x='52' y='132' class='panel-title'>Cached convention map</text>
  <text x='52' y='158' class='subtitle'>single flat object | warm plan</text>
  <text x='52' y='198' class='label'>Manual</text>
  <text x='364' y='198' text-anchor='end' class='value'>7.89 ns</text>
  <rect x='52' y='212' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='52' y='212' width='47' height='12' rx='6' fill='#94a3b8'/>
  <text x='52' y='266' class='label'>EasyMapper</text>
  <text x='364' y='266' text-anchor='end' class='value'>23.15 ns</text>
  <rect x='52' y='280' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='52' y='280' width='138' height='12' rx='6' fill='#34d399'/>
  <text x='52' y='334' class='label'>AutoMapper</text>
  <text x='364' y='334' text-anchor='end' class='value'>51.84 ns</text>
  <rect x='52' y='348' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='52' y='348' width='310' height='12' rx='6' fill='#a78bfa'/>
  <rect x='420' y='92' width='360' height='326' rx='20' fill='#0f172a' stroke='#334155'/>
  <text x='444' y='132' class='panel-title'>First usable map</text>
  <text x='444' y='158' class='subtitle'>construction + first plan compilation</text>
  <text x='444' y='198' class='label'>Manual</text>
  <text x='756' y='198' text-anchor='end' class='value'>860.00 ns</text>
  <rect x='444' y='212' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='444' y='212' width='4' height='12' rx='6' fill='#94a3b8'/>
  <text x='444' y='266' class='label'>EasyMapper</text>
  <text x='756' y='266' text-anchor='end' class='value'>556.87 us</text>
  <rect x='444' y='280' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='444' y='280' width='84' height='12' rx='6' fill='#34d399'/>
  <text x='444' y='334' class='label'>AutoMapper</text>
  <text x='756' y='334' text-anchor='end' class='value'>2.06 ms</text>
  <rect x='444' y='348' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='444' y='348' width='310' height='12' rx='6' fill='#a78bfa'/>
  <rect x='812' y='92' width='360' height='326' rx='20' fill='#0f172a' stroke='#334155'/>
  <text x='836' y='132' class='panel-title'>1,000 element maps</text>
  <text x='836' y='158' class='subtitle'>same cached element plan in a loop</text>
  <text x='836' y='198' class='label'>Manual</text>
  <text x='1148' y='198' text-anchor='end' class='value'>9.46 us</text>
  <rect x='836' y='212' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='836' y='212' width='48' height='12' rx='6' fill='#94a3b8'/>
  <text x='836' y='266' class='label'>EasyMapper</text>
  <text x='1148' y='266' text-anchor='end' class='value'>32.56 us</text>
  <rect x='836' y='280' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='836' y='280' width='166' height='12' rx='6' fill='#34d399'/>
  <text x='836' y='334' class='label'>AutoMapper</text>
  <text x='1148' y='334' text-anchor='end' class='value'>60.66 us</text>
  <rect x='836' y='348' width='310' height='12' rx='6' fill='#1e293b'/>
  <rect x='836' y='348' width='310' height='12' rx='6' fill='#a78bfa'/>
  <text x='28' y='450' class='footer'>.NET 10.0.9 | AMD Ryzen 7 8845HS | Windows 11 | ShortRun | source ecc28d1</text>
</svg>

