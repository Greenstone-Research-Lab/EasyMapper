name: Publish Beta Package

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-staging
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Validate and publish beta
    runs-on: windows-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run QA pipeline
        shell: pwsh
        run: ./eng/qa.ps1

      - name: Create beta package
        shell: pwsh
        run: |
          $version = "0.1.1-beta.${{ github.run_number }}"
          dotnet pack ./src/EasyMapper/EasyMapper.csproj `
            --configuration Release `
            --no-build `
            --output ./artifacts/staging `
            /p:PackageVersion=$version
          if ($LASTEXITCODE -ne 0) { throw "Beta pack failed." }

      - name: Validate NuGet publishing identity
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "The staging environment must define the NUGET_USER variable."
          }

      - name: Sign in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish beta to NuGet
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem `
            -LiteralPath ./artifacts/staging `
            -Filter *.nupkg `
            -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, but found $($packages.Count)."
          }

          dotnet nuget push $packages[0].FullName `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "Beta publish failed." }
