name: CI

on:
  pull_request:
    branches: [development, staging, master]
  push:
    branches: [development, staging, master, "feature/**"]

permissions:
  contents: read

jobs:
  qa:
    name: Build, test, inspect and pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run QA pipeline
        shell: pwsh
        run: ./eng/qa.ps1

      - name: Upload packages and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easymapper-qa
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/coverage/*.json
          if-no-files-found: warn
